# Publishes the app to GitHub Pages. Enable it once under
# Settings → Pages → Source: "GitHub Actions", then run this workflow
# from the Actions tab (or add `push: branches: [main]` to deploy on merge).
name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Optional: your Firebase web config, so this site is ready to sign in
          # without pasting it. Add it under Settings → Secrets and variables →
          # Actions → Variables as FIREBASE_CONFIG. See docs/CLOUD.md.
          VITE_FIREBASE_CONFIG: ${{ vars.FIREBASE_CONFIG }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
